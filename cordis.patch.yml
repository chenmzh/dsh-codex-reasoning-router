# Host-plane mount: team roles register on each agent scope and compose with any
# selected preset. The legacy Luna+Sol route guard remains available but is
# disabled unless requiredPresetId is explicitly configured.

- insert:
    - id: reasoning-router
      name: dsh-codex-reasoning-router
      config:
        teamEnabled: true
        presetIds: []
        roles:
          - id: brain
            kind: advisory
            description: Deep tool-less reasoning and architecture advice.
            provider: openai-codex
            model: gpt-5.6-sol
            reasoningEffort: max
            maxTokens: 3000
          - id: coordinator
            kind: advisory
            description: Decomposition, assignment, integration, and risk control.
            provider: openai-codex
            model: gpt-5.6-sol
            reasoningEffort: high
            maxTokens: 2200
          - id: worker
            kind: subagent
            description: Tool-capable implementation and verification worker.
            provider: openai-codex
            model: gpt-5.6-luna
            reasoningEffort: max
            subagentProvider: spawn
            maxDepth: 2
        requiredPresetId: ''
        lunaProvider: openai-codex
        lunaModel: gpt-5.6-luna
        solProvider: openai-codex
        solModel: gpt-5.6-sol
        initialSolReasoning: medium
        escalatedSolReasoning: high
        solAdviceMaxTokens: 2000
        solTimeoutMs: 30000
        initialConsultEnabled: true
        failOpen: true
